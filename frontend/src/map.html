<!DOCTYPE html>
<html>
  <head>
    <title>Map Example</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=395555c22f7ec2346538385c56f3530d"></script>
    <script>
      function initMap() {
        const map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: -34.397, lng: 150.644 },
          zoom: 8,
        });
      }
    </script>
  </head>
  <body onload="initMap()">
    <div id="map" style="width: 100%; height: 500px;"></div>
  </body>
</html>
